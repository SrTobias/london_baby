<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Missão Secreta</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@500;700;800&family=Special+Elite&display=swap">
<style>
/* Layout: one narrow agent's dossier — progress strip of 7 symbol stamps, then one mission card at a time. Single committed look (paper dossier), works on any host theme. */
:root{
  --paper:#E7EFEC;      /* pale dossier paper */
  --card:#F8FBF9;
  --ink:#143C3B;        /* deep teal ink */
  --muted:#557371;
  --red:#C8232C;        /* stamp red */
  --brass:#B88A22;
  --line:#C7D6D2;
  --display:"Bungee","Arial Black",Impact,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --type:"Special Elite","Courier New",Courier,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px 40px;
  background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:22px 22px;
}
.wrap{max-width:30rem;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:1.35rem;letter-spacing:.02em;color:var(--ink);margin:0}
.brand span{color:var(--red)}
.file{font-family:var(--type);font-size:.85rem;color:var(--muted)}
.stamps{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.stamp{aspect-ratio:1;max-width:100%;border:2px dashed var(--line);border-radius:50%;display:grid;place-items:center;
  font-family:var(--display);font-size:1.15rem;color:transparent;background:var(--card);transition:transform .3s}
.stamp.done{border:2px solid var(--red);color:var(--red);transform:rotate(-8deg)}
.stamp.now{border-color:var(--ink);border-style:solid}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:22px 20px;display:flex;flex-direction:column;gap:14px;
  box-shadow:0 1px 0 var(--line),0 12px 24px -18px rgba(20,60,59,.45);position:relative}
.eyebrow{font-family:var(--type);font-size:.9rem;letter-spacing:.06em;color:var(--red);text-transform:uppercase;margin:0}
h1,h2{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:1.9rem}
h2{font-size:1.4rem}
p{margin:0}
.riddle{font-size:1.2rem;font-weight:700;line-height:1.45;border-left:4px solid var(--brass);padding-left:14px}
.small{font-size:.92rem;color:var(--muted)}
label{font-weight:800;font-size:.95rem}
input{width:100%;font-family:var(--type);font-size:1.3rem;letter-spacing:.08em;text-transform:uppercase;padding:12px 14px;
  border:2px solid var(--ink);border-radius:4px;background:#fff;color:var(--ink)}
input:focus-visible,button:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap}
button{font-family:var(--body);font-weight:800;font-size:1.05rem;border-radius:4px;padding:12px 18px;cursor:pointer;border:2px solid var(--ink)}
.go{background:var(--ink);color:var(--card);flex:1}
.ghost{background:transparent;color:var(--ink)}
.msg{min-height:1.5em;font-weight:700}
.msg.bad{color:var(--red)}
.hint{font-family:var(--type);background:var(--paper);border-radius:4px;padding:10px 12px}
.found{display:flex;gap:16px;align-items:center}
.big-letter{flex:none;width:84px;height:84px;border:3px solid var(--red);border-radius:50%;display:grid;place-items:center;
  font-family:var(--display);font-size:2.6rem;color:var(--red);transform:rotate(-10deg);animation:stamp .45s ease-out}
@keyframes stamp{from{transform:scale(1.8) rotate(-10deg);opacity:0}to{transform:scale(1) rotate(-10deg);opacity:1}}
.fact{font-family:var(--type);font-size:1.02rem;line-height:1.55}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-family:var(--type);font-size:.95rem}
.log li{display:flex;gap:10px;border-bottom:1px dotted var(--line);padding-bottom:6px}
.log b{color:var(--red);font-family:var(--display);font-weight:400;width:1.2em}
.slots,.tiles{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.slot,.tile{width:44px;height:52px;border-radius:4px;font-family:var(--display);font-size:1.5rem;display:grid;place-items:center;padding:0}
.slot{border:2px dashed var(--muted);background:var(--paper);color:var(--ink)}
.slot.filled{border-style:solid;border-color:var(--ink);background:#fff}
.tile{border:2px solid var(--red);background:#fff;color:var(--red)}
.tile[disabled]{opacity:.2;cursor:default}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.reveal h1{font-size:2.6rem;color:var(--red)}
.ticket{border:2px solid var(--ink);border-radius:6px;display:grid;grid-template-columns:1fr 1fr;overflow:hidden}
.ticket div{padding:10px 12px;border-right:1px dashed var(--ink)}
.ticket div:last-child{border-right:0}
.ticket small{display:block;font-family:var(--type);color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.06em}
.ticket strong{font-family:var(--display);font-weight:400;font-size:1.15rem}
.plans{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px;font-weight:700}
.foot{text-align:center}
.link{background:none;border:0;color:var(--muted);font-size:.85rem;text-decoration:underline;padding:4px;font-weight:500}
canvas#fx{position:fixed;inset:0;pointer-events:none;width:100%;height:100%;z-index:30}
/* departures board overlay */
.board{position:fixed;inset:0;z-index:20;background:var(--ink);color:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  transition:opacity .5s}
.board.out{opacity:0}
.board .lbl{font-family:var(--type);letter-spacing:.2em;font-size:.85rem;color:#8FB3AF;text-transform:uppercase;text-align:center}
.flaps{display:flex;gap:5px}
.flap{width:min(11vw,52px);height:min(15vw,72px);background:#0B2423;border-radius:4px;display:grid;place-items:center;position:relative;
  font-family:var(--display);font-size:min(8vw,2.4rem);color:#F2C14E;box-shadow:inset 0 -2px 0 rgba(0,0,0,.4)}
.flap::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,.55)}
.flap.set{color:var(--card)}
.board .status{font-family:var(--display);font-size:1.3rem;color:#F2C14E;min-height:1.5em;text-align:center}
.confirm{font-family:var(--display);color:var(--red);background:var(--card);padding:6px 14px;border:3px solid var(--red);transform:rotate(-6deg);animation:stamp .45s ease-out}
.board button{background:#F2C14E;border-color:#F2C14E;color:var(--ink)}
/* boarding pass */
.pass{background:#fff;border:2px solid var(--ink);border-radius:10px;overflow:hidden;animation:rise .7s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(40px) rotate(-2deg);opacity:0}to{transform:none;opacity:1}}
.pass-top{background:var(--red);color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pass-top b{font-family:var(--display);font-weight:400;letter-spacing:.04em}
.pass-top span{font-family:var(--type);font-size:.85rem}
.route{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:16px 16px 8px}
.route div{min-width:0}
.iata{font-family:var(--display);font-size:2.4rem;line-height:1;color:var(--ink)}
.city{font-family:var(--type);font-size:.85rem;color:var(--muted)}
.plane{flex:1;text-align:center;font-size:1.6rem;color:var(--red);border-bottom:2px dotted var(--line);line-height:1;padding-bottom:6px}
.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 12px;padding:8px 16px 16px}
.fields .wide{grid-column:1/-1}
.fields small{display:block;font-family:var(--type);font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.fields strong{font-family:var(--display);font-weight:400;font-size:1.05rem;word-break:break-word}
.perf{border-top:2px dashed var(--line);position:relative;margin:0 0}
.perf::before,.perf::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--card);border:2px solid var(--ink)}
.perf::before{left:-12px}.perf::after{right:-12px}
.stub{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.barcode{height:44px;flex:1;min-width:150px;max-width:100%;display:flex;align-items:stretch;gap:2px}
.barcode i{background:var(--ink);display:block}
.stub small{font-family:var(--type);font-size:.8rem;color:var(--muted)}
input#agent{text-transform:none}
/* symbol keypad */
.keypad{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.key{aspect-ratio:1;max-width:100%;padding:0;display:grid;place-items:center;font-family:var(--display);font-size:1.35rem;background:#fff;color:var(--ink);border:2px solid var(--ink)}
.key:active{background:var(--ink);color:var(--card)}
.key[disabled]{opacity:.25;cursor:default}
.slot{font-size:1.4rem}
.stamp.done,.big-letter{font-family:var(--display)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<canvas id="fx" aria-hidden="true"></canvas>
<div class="wrap">
  <header>
    <p class="brand">MISSÃO <span>SECRETA</span></p>
    <span class="file" id="file">Dossiê nº 0212</span>
  </header>
  <div class="stamps" id="stamps" aria-label="Símbolos registados"></div>
  <main id="app"></main>
  <div class="foot"><button class="link" id="reset" type="button">Recomeçar missão</button></div>
</div>

<script>
/* Each card in the house carries one symbol. Each symbol stands for one letter of the destination. */
const MISSIONS=[
 {sym:"&",letter:"O",where:"Guardo o frio e o leite fresquinho.<br>Abre a minha porta devagarinho!",hint:"É na cozinha e faz frio lá dentro.",fact:"Na cidade misteriosa, há quem pare tudo à tarde para beber uma chávena de chá."},
 {sym:"#",letter:"R",where:"Tenho almofadas e sou fofinho.<br>É aqui que se vê TV um bocadinho.",hint:"Procura entre as almofadas da sala.",fact:"Lá os autocarros são vermelhos e têm dois andares. Vais querer ir lá para cima!"},
 {sym:"★",letter:"L",where:"Durmo contigo todas as noites.<br>Espreita debaixo da minha almofada.",hint:"É no teu quarto.",fact:"Há um relógio tão famoso que até o sino dele tem nome próprio."},
 {sym:"@",letter:"S",where:"Escova, pasta e espelho também:<br>procura onde lavas os dentes bem.",hint:"É na casa de banho, perto do lavatório.",fact:"Nesta cidade vive um rei, e as joias da coroa estão guardadas numa torre muito antiga."},
 {sym:"%",letter:"D",where:"Vou contigo à rua, um de cada lado.<br>Procura dentro de um sapato guardado.",hint:"Vê na sapateira ou junto à porta de casa.",fact:"Lá chove muitas vezes, por isso o guarda-chuva é o melhor amigo de quem lá vive."},
 {sym:"!",letter:"E",where:"Tenho muitas histórias para contar.<br>Numa prateleira me vais encontrar.",hint:"Procura entre os livros.",fact:"Há uma estação com uma plataforma mágica escondida entre a 9 e a 10. Será que existe mesmo?"},
 {sym:"?",letter:"N",where:"É à minha volta que a família vem comer.<br>Olha debaixo de mim, vais ver!",hint:"Espreita debaixo da mesa de jantar.",fact:"Há uma ponte com duas torres que se abre ao meio para os barcos passarem."}
];
const ANSWER="LONDRES";
const KEYS=["♦","&","+","★","~","#","=","%","*","@","§","!","^","?"]; // 7 real symbols mixed with 7 decoys
const symFor=l=>MISSIONS.find(m=>m.letter===l).sym;
const KEY="missao-secreta-v2";
let S={step:-1,phase:"intro",entered:[],hint:false,name:""};
function load(){try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&typeof v.step==="number")S=Object.assign(S,v)}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const app=document.getElementById("app");
const $=s=>app.querySelector(s);
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function stamps(){
  const done=S.phase==="final"||S.phase==="reveal"?7:(S.phase==="found"?S.step+1:Math.max(S.step,0));
  document.getElementById("stamps").innerHTML=MISSIONS.map((m,i)=>
    `<div class="stamp ${i<done?"done":""} ${i===S.step&&S.phase==="mission"?"now":""}" aria-label="${i<done?"Símbolo "+esc(m.sym):"Por descobrir"}">${i<done?esc(m.sym):""}</div>`).join("");
}

function render(){
  stamps();
  if(S.phase==="intro")return intro();
  if(S.phase==="mission")return mission();
  if(S.phase==="found")return found();
  if(S.phase==="final")return finalWindow();
  if(S.phase==="reveal")return reveal();
}

function intro(){
  app.innerHTML=`<section class="card">
    <p class="eyebrow">Mensagem confidencial</p>
    <h1>Agente, temos uma missão para ti</h1>
    <p>Há um destino secreto escondido nesta casa, mas está em código. Para o descobrires, vais ter de cumprir <strong>7 missões</strong>.</p>
    <p>Em cada missão, uma adivinha diz-te onde procurar. Lá vais encontrar um cartão com um <strong>símbolo secreto</strong>. Regista-o aqui e guarda bem o cartão.</p>
    <p>No fim, com os 7 símbolos, o painel de partidas descodifica o destino.</p>
    <p class="small">Esta mensagem não se autodestrói, mas guarda segredo.</p>
    <label for="agent">O teu nome de agente</label>
    <input id="agent" name="agent" maxlength="20" autocomplete="off" placeholder="Escreve o teu nome" value="${esc(S.name||"")}">
    <div class="row"><button class="go" id="start" type="button">Aceito a missão</button></div>
  </section>`;
  $("#start").onclick=()=>{S.name=$("#agent").value.trim().slice(0,20);S.step=0;S.phase="mission";S.hint=false;save();render()};
}

function keypad(disabled=new Set()){
  return `<div class="keypad" role="group" aria-label="Símbolos">${KEYS.map(k=>`<button type="button" class="key" data-k="${esc(k)}" ${disabled.has(k)?"disabled":""}>${esc(k)}</button>`).join("")}</div>`;
}

function mission(){
  const m=MISSIONS[S.step];
  app.innerHTML=`<section class="card">
    <p class="eyebrow">Missão ${S.step+1} de 7</p>
    <h2>Onde está o cartão?</h2>
    <p class="riddle">${m.where}</p>
    <p><strong>Encontraste o cartão?</strong> Toca no símbolo que lá está.</p>
    ${keypad()}
    <p class="msg" id="msg" role="status"></p>
    <div class="row"><button class="ghost" type="button" id="hintBtn">Preciso de ajuda</button></div>
    <p class="hint" id="hint" ${S.hint?"":"hidden"}>${m.hint}</p>
  </section>`;
  $("#hintBtn").onclick=()=>{S.hint=true;save();$("#hint").hidden=false};
  app.querySelectorAll(".key").forEach(b=>b.onclick=()=>{
    if(b.dataset.k===m.sym){S.phase="found";save();render();window.scrollTo({top:0})}
    else{const msg=$("#msg");msg.className="msg bad";msg.textContent="Esse não é o símbolo do cartão. Olha bem e tenta outra vez.";
      const k=$(".keypad");k.classList.remove("shake");void k.offsetWidth;k.classList.add("shake")}
  });
}

function found(){
  const m=MISSIONS[S.step];
  const last=S.step===MISSIONS.length-1;
  app.innerHTML=`<section class="card">
    <p class="eyebrow">Missão ${S.step+1} cumprida</p>
    <div class="found"><div class="big-letter" aria-hidden="true">${esc(m.sym)}</div>
      <div><h2>Símbolo registado</h2><p class="small">Guarda o cartão. Vais precisar dele na missão final.</p></div></div>
    <p class="fact">Pista sobre o destino: ${m.fact}</p>
    ${log()}
    <div class="row"><button class="go" id="next" type="button">${last?"Ir para a missão final":"Próxima missão"}</button></div>
  </section>`;
  $("#next").onclick=()=>{
    if(last){S.phase="final";S.entered=[]}else{S.step++;S.phase="mission";S.hint=false}
    save();render();window.scrollTo({top:0});
  };
}

function log(){
  const n=S.phase==="found"?S.step+1:7;
  return `<div><p class="eyebrow" style="margin-bottom:6px">Registo do agente</p><ul class="log">${
    MISSIONS.slice(0,n).map((m,i)=>`<li><b>${esc(m.sym)}</b><span>Missão ${i+1}</span></li>`).join("")}</ul></div>`;
}

function finalWindow(){
  const used=new Set(S.entered);
  app.innerHTML=`<section class="card">
    <p class="eyebrow">Missão final</p>
    <h2>Introduz os 7 símbolos secretos</h2>
    <p>Pega nos teus cartões e toca nos 7 símbolos que encontraste, pela ordem que quiseres. Para tirar um símbolo, toca nele em cima.</p>
    <div class="slots" id="slots">${Array.from({length:7},(_,k)=>{
      const t=S.entered[k];return `<button type="button" class="slot ${t!==undefined?"filled":""}" data-k="${k}" aria-label="Espaço ${k+1}">${t!==undefined?esc(t):""}</button>`}).join("")}</div>
    ${keypad(used)}
    <p class="msg" id="msg" role="status"></p>
    <div class="row"><button class="go" id="decode" type="button" ${S.entered.length<7?"disabled":""}>Descodificar destino</button></div>
  </section>`;
  app.querySelectorAll(".key").forEach(b=>b.onclick=()=>{if(S.entered.length>=7)return;S.entered.push(b.dataset.k);save();finalWindow()});
  app.querySelectorAll(".slot").forEach(b=>b.onclick=()=>{const k=+b.dataset.k;if(S.entered[k]===undefined)return;S.entered.splice(k,1);save();finalWindow()});
  $("#decode").onclick=()=>{
    const need=new Set(MISSIONS.map(m=>m.sym));
    const ok=S.entered.length===7&&S.entered.every(s=>need.has(s));
    if(ok){S.phase="reveal";save();departures()}
    else{const msg=$("#msg");msg.className="msg bad";msg.textContent="Há pelo menos um símbolo que não está nos teus cartões. Confirma e troca-o.";
      const s=$("#slots");s.classList.remove("shake");void s.offsetWidth;s.classList.add("shake")}
  };
}

/* departures board: the coded word appears in symbols, then each one decodes in random order */
function departures(){
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const b=document.createElement("div");b.className="board";b.setAttribute("role","dialog");b.setAttribute("aria-label","Painel de partidas");
  b.innerHTML=`<p class="lbl">Painel de partidas · Voo MS 0212</p>
    <p class="lbl">Destino</p>
    <div class="flaps">${[...ANSWER].map(l=>`<div class="flap">${esc(symFor(l))}</div>`).join("")}</div>
    <p class="status" id="bstatus">A descodificar…</p>
    <div id="bact" style="min-height:52px"></div>`;
  document.body.appendChild(b);
  const flaps=[...b.querySelectorAll(".flap")],AZ="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  const order=[...ANSWER].map((_,i)=>i).sort(()=>Math.random()-.5);
  const first=reduce?0:1300, each=reduce?0:850, spinFor=reduce?0:650;
  order.forEach((i,n)=>{
    const startAt=first+n*each;
    setTimeout(()=>{
      const f=flaps[i];
      const iv=setInterval(()=>{f.textContent=AZ[Math.floor(Math.random()*26)]},55);
      setTimeout(()=>{clearInterval(iv);f.textContent=ANSWER[i];f.classList.add("set");if(n===order.length-1)finish()},spinFor);
    },startAt);
  });
  function finish(){
    b.querySelector("#bstatus").innerHTML=`<span class="confirm">Destino confirmado</span>`;
    setTimeout(()=>{
      b.querySelector("#bact").innerHTML=`<button type="button" id="seepass">Ver o meu cartão de embarque</button>`;
      const btn=b.querySelector("#seepass");btn.focus();
      btn.onclick=()=>{b.classList.add("out");render();window.scrollTo({top:0});confetti();setTimeout(()=>b.remove(),500)};
    },reduce?0:900);
  }
}

function barcode(seed){
  let x=seed,out="";
  for(let i=0;i<46;i++){x=(x*9301+49297)%233280;const w=1+Math.floor(x/233280*4);out+=`<i style="flex:${w} 0 0"></i>`}
  return out;
}

function reveal(){
  const nm=S.name?esc(S.name.toUpperCase()):"AGENTE SECRETA";
  app.innerHTML=`<section class="card reveal">
    <p class="eyebrow">Missão cumprida${S.name?", "+esc(S.name):""}</p>
    <h1>Vamos a Londres!</h1>
    <p>Tu, a mãe e o Titi vão passar uns dias em Londres, mesmo na época de Natal. Aqui está o teu cartão de embarque de agente.</p>
    <div class="pass" aria-label="Cartão de embarque">
      <div class="pass-top"><b>Cartão de embarque</b><span>Missão Secreta · Voo MS 0212</span></div>
      <div class="route">

/* confetti */
const cv=document.getElementById("fx"),cx=cv.getContext("2d");let parts=[],raf=0;
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;
  const cols=["#C8232C","#143C3B","#B88A22","#2F6FB3","#FFFFFF"];
  for(let i=0;i<160;i++)parts.push({x:Math.random()*cv.width,y:-Math.random()*cv.height*.5,vx:(Math.random()-.5)*4,vy:2+Math.random()*4,
    r:(4+Math.random()*6)*devicePixelRatio,a:Math.random()*6,va:(Math.random()-.5)*.3,c:cols[i%cols.length]});
  if(!raf)tick();
}
function tick(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy*devicePixelRatio;p.a+=p.va;cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);
    cx.fillStyle=p.c;cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);cx.restore()});
  parts=parts.filter(p=>p.y<cv.height+20);
  raf=parts.length?requestAnimationFrame(tick):0;
  if(!raf)cx.clearRect(0,0,cv.width,cv.height);
}

/* reset with in-page confirmation */
const rs=document.getElementById("reset");let armed=false;
rs.onclick=()=>{
  if(!armed){armed=true;rs.textContent="Toca outra vez para apagar o progresso";setTimeout(()=>{armed=false;rs.textContent="Recomeçar missão"},4000);return}
  armed=false;rs.textContent="Recomeçar missão";S={step:-1,phase:"intro",entered:[],hint:false,name:S.name||""};save();render();
};

function start(data){if(data&&data.S)S=data.S;else load();render()}
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
